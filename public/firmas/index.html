<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>Firmas de correo | MaiAtesta</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        padding: 32px;
        color: #101821;
        background: #f7fafc;
      }

      main {
        max-width: 920px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0 0 24px;
        color: #384a5d;
      }

      article {
        margin: 0 0 28px;
        padding: 20px;
        border: 1px solid #d8e0e8;
        background: #ffffff;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      img {
        display: block;
        max-width: 100%;
        height: auto;
        margin-bottom: 12px;
        border: 1px solid #edf1f5;
      }

      code {
        display: block;
        overflow-wrap: anywhere;
        padding: 10px 12px;
        color: #101821;
        background: #eef3f7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Firmas de correo MaiAtesta</h1>
      <p>Usa estas URLs directas como imagen remota para firmas de Gmail, Outlook u otro cliente de correo.</p>

      <article>
        <h2>Firma Emilio</h2>
        <img src="/firmas/firma-emilio.png" width="640" height="287" alt="Firma de correo Emilio" />
        <code>https://maiatesta.com/firmas/firma-emilio.png</code>
      </article>

      <article>
        <h2>Firma Luis</h2>
        <img src="/firmas/firma-luis.png" width="640" height="274" alt="Firma de correo Luis" />
        <code>https://maiatesta.com/firmas/firma-luis.png</code>
      </article>
    </main>
  </body>
</html>
